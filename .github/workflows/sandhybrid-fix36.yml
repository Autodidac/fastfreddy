name: SandHybrid Fix36 Restored Hives and Two-State Swarm

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/fix36_hive_swarm.py'
      - 'tools/audit_fix36.py'
      - '.github/workflows/sandhybrid-fix36.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sandhybrid-fix36-release
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 04a735608afac5844e86fc91d6ba2112cac613c1
  FIX36_BASE_SHA: 5505bdfb3cd77c955d5a4b9804338c6fdf6b9789

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out Fix36 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply Fix36 source patch
        shell: pwsh
        run: |
          python tools/fix36_hive_swarm.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix36 source patch failed.' }

      - name: Audit source contracts
        shell: pwsh
        run: |
          python tools/audit_fix36.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix36 audit failed.' }
          python tools/audit_material_behaviors.py
          if ($LASTEXITCODE -ne 0) { throw 'Material audit failed.' }
          python tools/audit_ecology_motion.py
          if ($LASTEXITCODE -ne 0) { throw 'Ecology audit failed.' }
          python tools/validate_shader_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'Shader contract validation failed.' }

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout $env:VCPKG_COMMIT
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Windows x64 Release
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_HOST_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON `
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed.' }

      - name: Build every shader and C++23 target
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }

      - name: Run Windows C++23 tests
        shell: pwsh
        run: |
          ctest --test-dir build/windows -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }

      - name: Package Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist/windows'
          $stage = Join-Path $dist 'SandHybrid_Windows_x64_Fix36'
          $archive = Join-Path $dist 'SandHybrid_Windows_x64_Fix36.zip'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'build/windows/Release/epoch_sand.exe' (Join-Path $stage 'SandHybrid.exe') -Force
          Copy-Item 'build/windows/Release/shaders' (Join-Path $stage 'shaders') -Recurse -Force
          Copy-Item 'build/windows/Release/scenes' (Join-Path $stage 'scenes') -Recurse -Force
          Copy-Item README.md, LICENSE -Destination $stage -Force
          @('@echo off', 'cd /d "%~dp0"', 'SandHybrid.exe') |
            Set-Content -LiteralPath (Join-Path $stage 'run.bat') -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  SandHybrid_Windows_x64_Fix36.zip" |
            Set-Content -LiteralPath (Join-Path $dist 'SHA256SUMS-Windows.txt') -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandHybrid-Windows-x64-Fix36
          path: |
            dist/windows/SandHybrid_Windows_x64_Fix36.zip
            dist/windows/SHA256SUMS-Windows.txt
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Fix36 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxcb1-dev libvulkan-dev

      - name: Apply Fix36 source patch
        run: python3 tools/fix36_hive_swarm.py

      - name: Audit source contracts
        run: |
          python3 tools/audit_fix36.py
          python3 tools/audit_material_behaviors.py
          python3 tools/audit_ecology_motion.py
          python3 tools/validate_shader_contracts.py

      - name: Bootstrap pinned vcpkg
        run: |
          root="$RUNNER_TEMP/vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout "$VCPKG_COMMIT"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Configure Linux x64 Release
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_HOST_TRIPLET=x64-linux \
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=OFF \
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF \
            -DBUILD_TESTING=ON

      - name: Build every shader and C++23 target
        run: cmake --build build/linux --parallel

      - name: Run Linux C++23 tests
        run: ctest --test-dir build/linux --output-on-failure

      - name: Package Linux release
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist/linux"
          stage="$dist/SandHybrid_Linux_x64_Fix36"
          archive="$dist/SandHybrid_Linux_x64_Fix36.tar.gz"
          mkdir -p "$stage"
          cp build/linux/epoch_sand "$stage/SandHybrid"
          cp -R build/linux/shaders "$stage/shaders"
          cp -R build/linux/scenes "$stage/scenes"
          cp README.md LICENSE "$stage/"
          printf '#!/usr/bin/env bash\ncd "$(dirname "$0")"\nexec ./SandHybrid\n' > "$stage/run.sh"
          chmod +x "$stage/run.sh" "$stage/SandHybrid"
          tar -C "$dist" -czf "$archive" SandHybrid_Linux_x64_Fix36
          sha256sum "$archive" | sed 's# .*/#  #' > "$dist/SHA256SUMS-Linux.txt"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandHybrid-Linux-x64-Fix36
          path: |
            dist/linux/SandHybrid_Linux_x64_Fix36.tar.gz
            dist/linux/SHA256SUMS-Linux.txt
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [windows, linux]
    steps:
      - name: Check out verified Fix36 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify main did not move
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          test "$current" = "$FIX36_BASE_SHA" || {
            echo "main moved from $FIX36_BASE_SHA to $current; refusing to publish an unbuilt rebase" >&2
            exit 1
          }

      - name: Materialize verified source on main
        run: |
          set -euo pipefail
          python3 tools/fix36_hive_swarm.py
          python3 tools/audit_fix36.py
          rm -f tools/fix36_hive_swarm.py tools/audit_fix36.py
          rm -f .github/workflows/sandhybrid-fix36.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SandHybrid Fix36: restore suspended hives and two-state swarm'
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.9.1-fix36'
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && \
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$tag" \
            artifacts/SandHybrid-Windows-x64-Fix36/SandHybrid_Windows_x64_Fix36.zip \
            artifacts/SandHybrid-Windows-x64-Fix36/SHA256SUMS-Windows.txt \
            artifacts/SandHybrid-Linux-x64-Fix36/SandHybrid_Linux_x64_Fix36.tar.gz \
            artifacts/SandHybrid-Linux-x64-Fix36/SHA256SUMS-Linux.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title 'SandHybrid Fix36' \
            --notes 'Verified Windows and Linux release. Restores the suspended wooden ecosystem hive from the source immediately before PR #19 replaced it, uses that single live prefab in both Sandbox and Ecosystem, and keeps the buildable Bee nest identical. All 200 bee identities spawn without overwriting the perch or shell. Colony motion now has exactly two states: the hidden biohazard mask for two-thirds of the cycle and a breathing swarm circle for one-third, then back to biohazard.'

      - name: Close PR and remove temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" \
            --comment 'Fix36 verified on Windows and Linux; source and release were published.' || true
          git push origin --delete '${{ github.event.pull_request.head.ref }}' || true
